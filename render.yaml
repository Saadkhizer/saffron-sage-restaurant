services:
  - type: web
    name: saffron-sage-restaurant
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESTAURANT_NAME
        value: Saffron & Sage
      - key: CURRENCY_CODE
        value: PKR
      - key: CURRENCY_SYMBOL
        value: Rs
      - key: DELIVERY_FEE_CENTS
        value: 299
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
